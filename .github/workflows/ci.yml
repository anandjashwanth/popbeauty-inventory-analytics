name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build database, run queries and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests
      - name: Build database with enforced keys and checks
        run: python src/build_db.py
      - name: Run all 26 analysis queries
        run: python src/run_queries.py
      - name: Run tests
        run: pytest -q
